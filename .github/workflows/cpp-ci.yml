name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: cpp-ci
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        compiler: [g++-15, clang++-22]
        include:
          - compiler: g++-15
            name: "GCC 15"
            install: sudo apt-get install -y g++-15
          - compiler: clang++-22
            name: "Clang 22"
            install: sudo apt-get install -y clang-22
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libz3-dev libboost-all-dev
          ${{ matrix.install }}

      - name: Configure
        run: cmake --preset debug -D CMAKE_CXX_COMPILER=${{ matrix.compiler }} -G Ninja

      - name: Build
        run: cmake --build --preset debug -j2

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure
